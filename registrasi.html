<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi - Global Course</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: #050A18; color: #e0e0e0; }
        .bg-tech { background: radial-gradient(circle at top left, #1E40AF, transparent 40%), radial-gradient(circle at bottom right, #22D3EE, transparent 40%), linear-gradient(135deg, #020617 0%, #0F172A 100%); }
        .glow-border { border: 1px solid rgba(56, 189, 248, 0.3); box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        .btn-glow { background: linear-gradient(45deg, #10b981, #059669); box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); transition: all 0.3s ease; }
        .btn-glow:hover { transform: translateY(-3px); box-shadow: 0 0 25px rgba(16, 185, 129, 0.7); }
        .btn-home { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.3); }
        .card-tech { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(55, 65, 81, 0.5); }
        .text-gradient { background: linear-gradient(to right, #38bdf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input, select, textarea { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(75, 85, 99, 0.5); color: #e0e0e0; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
        .loading { display: none; }
        #successPage { display: none; }
        .checkmark { width: 80px; height: 80px; border-radius: 50%; display: block; stroke-width: 4; stroke: #4bb543; stroke-miterlimit: 10; margin: 10% auto; box-shadow: inset 0px 0px 0px #4bb543; animation: fill 0.4s ease-in-out 0.4s forwards, scale 0.3s ease-in-out 0.9s both; }
        .checkmark-circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 4; stroke: #4bb543; fill: none; animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards; }
        .checkmark-check { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards; }
        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
        @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale(1.1); } }
        @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 15px rgba(75, 181, 67, 0.2); } }
    </style>
</head>
<body class="bg-tech min-h-screen py-10">
<div class="max-w-4xl mx-auto px-4">
    <div class="text-center mb-6">
        <img src="Logo Global.png" alt="Logo Global Course" class="h-20 w-auto mx-auto" onerror="this.src='https://placehold.co/200x200/0f172a/38bdf8?text=Global+Course'">
    </div>
    <div class="text-center mb-10">
        <h1 class="text-4xl font-bold"><span class="text-gradient">FORMULIR</span> PENDAFTARAN</h1>
        <p class="text-slate-400 mt-2">Yayasan Pendidikan & Pelatihan Global Course</p>
    </div>

    <!-- PESAN PERINGATAN -->
    <div id="infoAlert" class="hidden mb-6 p-5 rounded-xl bg-rose-950/60 border border-rose-500/50 text-rose-200 text-sm flex items-start gap-3">
        <i class="fas fa-exclamation-triangle mt-1 text-lg flex-shrink-0 text-rose-400 animate-pulse"></i>
        <div>
            <span class="font-bold block text-base mb-1" id="infoTitle">Peringatan!</span>
            <span id="infoText" class="block text-slate-300"></span>
        </div>
    </div>

    <div id="formCard" class="card-tech rounded-2xl p-8 md:p-10 glow-border">
        <form id="registrationForm">
            <div class="mb-6">
                <label class="block text-slate-300 mb-2 font-medium">Nama Lengkap</label>
                <input type="text" id="nama" required class="w-full px-4 py-3 rounded-lg">
            </div>
            
            <div class="mb-6">
                <label class="block text-slate-300 mb-2 font-medium">NISN</label>
                <input type="text" id="nisn" required class="w-full px-4 py-3 rounded-lg" placeholder="Contoh: 0012345678">
            </div>
            
            <div class="mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-slate-300 mb-2 font-medium">Tempat Lahir</label>
                    <input type="text" id="tempat_lahir" required class="w-full px-4 py-3 rounded-lg">
                </div>
                <div>
                    <label class="block text-slate-300 mb-2 font-medium">Tanggal Lahir</label>
                    <input type="date" id="tgl_lahir" required class="w-full px-4 py-3 rounded-lg">
                </div>
            </div>
            
            <div class="mb-6">
                <label class="block text-slate-300 mb-2 font-medium">Alamat Lengkap</label>
                <textarea id="alamat" required rows="3" class="w-full px-4 py-3 rounded-lg"></textarea>
            </div>
            
            <div class="mb-6">
                <label class="block text-slate-300 mb-2 font-medium">Nomor WhatsApp</label>
                <input type="text" id="hp" required class="w-full px-4 py-3 rounded-lg" placeholder="Contoh: 08123456789">
            </div>
            
            <div class="mb-6">
                <label class="block text-slate-300 mb-2 font-medium">Pilih Program Kursus</label>
                <select id="program" required class="w-full px-4 py-3 rounded-lg">
                    <option value="">-- Silakan Pilih --</option>
                    <option value="Microsoft Office">💻 Microsoft Office</option>
                    <option value="Desain Grafis">🎨 Desain Grafis</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="btn-glow w-full text-white font-bold py-4 px-8 rounded-xl text-lg flex items-center justify-center gap-2">
                <span id="btnText" class="text-btn"><i class="fas fa-save"></i> SIMPAN DATA PENDAFTARAN</span>
                <span id="btnLoading" class="loading"><i class="fas fa-spinner fa-spin animate-spin"></i> MENYIMPAN DATA...</span>
            </button>
        </form>
    </div>

    <div id="successPage" class="card-tech rounded-2xl p-8 md:p-10 glow-border text-center">
        <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
            <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
            <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>
        <h2 class="text-3xl font-bold text-green-400 mt-4">SELAMAT!</h2>
        <p class="text-xl text-slate-300 mt-2">Anda sudah terdaftar di LKP Global Course</p>
        
        <div class="mt-8 text-left bg-slate-800/50 p-4 rounded-lg border border-slate-700">
            <h3 class="text-center font-semibold text-cyan-400 mb-4 border-b border-slate-700 pb-2">Data Pendaftaran Anda</h3>
            
            <div class="bg-cyan-950/40 border border-cyan-500/30 p-3 rounded-lg mb-4 flex flex-col items-center justify-center">
                <span class="text-xs text-cyan-300 font-bold uppercase tracking-wider">Nomor Induk Siswa Global Course</span>
                <span id="sNisgc" class="text-2xl font-extrabold text-green-400 mt-1 tracking-wider"></span>
            </div>

            <div class="grid grid-cols-3 gap-2 text-sm mb-2"><span class="text-slate-400">Nama</span><span>:</span><span id="sNama" class="text-white font-medium"></span></div>
            <div class="grid grid-cols-3 gap-2 text-sm mb-2"><span class="text-slate-400">NISN</span><span>:</span><span id="sNisn" class="text-white font-medium"></span></div>
            <div class="grid grid-cols-3 gap-2 text-sm mb-2"><span class="text-slate-400">TTL</span><span>:</span><span id="sTtl" class="text-white font-medium"></span></div>
            <div class="grid grid-cols-3 gap-2 text-sm mb-2"><span class="text-slate-400">Alamat</span><span>:</span><span id="sAlamat" class="text-white font-medium"></span></div>
            <div class="grid grid-cols-3 gap-2 text-sm mb-2"><span class="text-slate-400">HP/WA</span><span>:</span><span id="sHp" class="text-white font-medium"></span></div>
            <div class="grid grid-cols-3 gap-2 text-sm"><span class="text-slate-400">Program</span><span>:</span><span id="sProgram" class="text-white font-medium"></span></div>
        </div>

        <div class="mt-8">
            <a href="index.html" class="btn-home inline-flex items-center gap-2 px-6 py-3 rounded-lg text-cyan-400 w-full justify-center border border-cyan-500/30">
                <i class="fas fa-home"></i> Kembali ke Beranda
            </a>
        </div>
    </div>

    <div class="text-center mt-10">
        <p class="text-slate-400">Hubungi kami di: <a href="https://wa.me/6287781865701" class="text-green-400 font-bold">087781865701</a></p>
    </div>
</div>

<script>
// ✅ GANTI DENGAN LINK BARU DARI HASIL SEBARKAN
const API_URL = "https://script.google.com/macros/s/AKfycbzncSJv8uVEBCBg6iZRcrWlbLG0r03fBzAYLHEkxBaJ_a5Q19iYpAcxEdIKauUsX2KWEQ/exec";
const formCard = document.getElementById('formCard');
const sukses = document.getElementById('successPage');
const infoAlert = document.getElementById('infoAlert');
const infoTitle = document.getElementById('infoTitle');
const infoText = document.getElementById('infoText');

function generateNISGC() {
    const sekarang = new Date();
    const tgl = String(sekarang.getDate()).padStart(2, '0');
    const bln = String(sekarang.getMonth() + 1).padStart(2, '0');
    const thn = String(sekarang.getFullYear()).slice(-2);
    
    const kunci = `urutan_${sekarang.getFullYear()}${bln}${tgl}`;
    let urutan = parseInt(localStorage.getItem(kunci) || "0") + 1;
    localStorage.setItem(kunci, urutan);
    
    const noUrut = String(urutan).padStart(3, '0');
    return `${noUrut}${bln}${tgl}${thn}`;
}

document.getElementById('registrationForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    infoAlert.classList.add('hidden');
    
    const btnText = document.getElementById('btnText');
    const btnLoading = document.getElementById('btnLoading');
    const submitBtn = document.getElementById('submitBtn');
    
    btnText.style.display = 'none';
    btnLoading.style.display = 'inline-block';
    submitBtn.disabled = true;
    submitBtn.classList.remove('btn-glow');
    submitBtn.classList.add('bg-slate-700', 'cursor-not-allowed');

    try {
        const nisgc = generateNISGC();
        
        const data = {
            timestamp: new Date().toLocaleString('id-ID'),
            nama: document.getElementById('nama').value,
            nisn: document.getElementById('nisn').value,
            tempat_lahir: document.getElementById('tempat_lahir').value,
            tgl_lahir: document.getElementById('tgl_lahir').value,
            alamat: document.getElementById('alamat').value,
            hp: document.getElementById('hp').value,
            program: document.getElementById('program').value,
            nisgc: nisgc
        };

        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const hasil = await res.json();

        if (hasil.status === "ganda") {
            // NISN sudah ada
            infoTitle.textContent = "Pendaftaran Gagal";
            infoText.textContent = hasil.pesan;
            infoAlert.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (hasil.status === "sukses") {
            // Berhasil disimpan
            document.getElementById('sNisgc').innerText = nisgc;
            document.getElementById('sNama').innerText = data.nama;
            document.getElementById('sNisn').innerText = data.nisn;
            document.getElementById('sTtl').innerText = `${data.tempat_lahir}, ${data.tgl_lahir}`;
            document.getElementById('sAlamat').innerText = data.alamat;
            document.getElementById('sHp').innerText = data.hp;
            document.getElementById('sProgram').innerText = data.program;

            formCard.style.display = 'none';
            sukses.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            throw new Error(hasil.pesan || "Terjadi kesalahan");
        }

    } catch (err) {
        console.error(err);
        infoTitle.textContent = "Kesalahan";
        infoText.textContent = "Gagal terhubung ke server. Coba lagi nanti.";
        infoAlert.classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    } finally {
        btnText.style.display = 'inline-block';
        btnLoading.style.display = 'none';
        submitBtn.disabled = false;
        submitBtn.classList.add('btn-glow');
        submitBtn.classList.remove('bg-slate-700', 'cursor-not-allowed');
    }
});
</script>
</body>
</html>
